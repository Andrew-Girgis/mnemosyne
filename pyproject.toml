[project]
name = "mnemosyne"
version = "0.1.0"
description = "Self-hosted activity and project tracker: coding time from Wakapi, projects, tasks and ideas across your machines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "textual>=8.2.8",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
mnemosyne = "mnemosyne.cli:main"
mnemosyne-admin = "mnemosyne.admin:app"
mnemosyne-server = "mnemosyne.server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemosyne"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "BLE"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the framework idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "RUF001", "RUF003"]
"src/mnemosyne/tui/*" = ["RUF012"]  # Textual's BINDINGS/CSS class attributes are the framework idiom
